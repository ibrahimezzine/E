<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Chat Emojis</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #4ecca3;
            font-size: 24px;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0px #0f3460;
            line-height: 1.5;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .emoji-card {
            background: rgba(255, 255, 255, 0.05);
            border: 3px solid #4ecca3;
            padding: 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .emoji-card:hover {
            background: rgba(78, 204, 163, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(78, 204, 163, 0.3);
        }

        .emoji-display {
            font-size: 32px;
            margin-bottom: 10px;
            text-align: center;
        }

        .emoji-name {
            font-size: 10px;
            color: #e94560;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .copy-btn {
            font-family: 'Press Start 2P', cursive;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            padding: 8px 12px;
            font-size: 8px;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: #45b893;
            transform: scale(1.05);
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .copied {
            background: #e94560 !important;
            color: #fff !important;
        }

        .search-box {
            width: 100%;
            padding: 15px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid #4ecca3;
            color: #fff;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .copy-all-btn {
            font-family: 'Press Start 2P', cursive;
            background: #e94560;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 30px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            transition: all 0.3s ease;
        }

        .copy-all-btn:hover {
            background: #d93651;
            transform: scale(1.05);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4ecca3;
            color: #1a1a2e;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 10px;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .notification.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minecraft Chat Emojis</h1>
        
        <input type="text" class="search-box" id="searchBox" placeholder="Search emojis...">
        
        <button class="copy-all-btn" onclick="copyAllEmojis()">Copy All Emojis</button>

        function renderEmojis(filteredEmojis = emojis) {
            const grid = document.getElementById('emojiGrid');
            grid.innerHTML = '';
            
            filteredEmojis.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'emoji-card';
                card.innerHTML = `
                    <div class="emoji-display">${emoji.symbol}</div>
                    <div class="emoji-name">${emoji.name}</div>
                    <button class="copy-btn" onclick="copyEmoji('${emoji.symbol}', ${index})">Copy</button>
                `;
                grid.appendChild(card);
            });
        }

        function copyEmoji(symbol, index) {
            navigator.clipboard.writeText(symbol).then(() => {
                showNotification('Copied: ' + symbol);
                const buttons = document.querySelectorAll('.copy-btn');
                buttons[index].textContent = 'Copied!';
                buttons[index].classList.add('copied');
                setTimeout(() => {
                    buttons[index].textContent = 'Copy';
                    buttons[index].classList.remove('copied');
                }, 1500);
            });
        }

        function copyAllEmojis() {
            const allSymbols = emojis.map(e => e.symbol).join(' ');
            navigator.clipboard.writeText(allSymbols).then(() => {
                showNotification('All emojis copied!');
            });
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }

        document.getElementById('searchBox').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = emojis.filter(emoji => 
                emoji.name.toLowerCase().includes(searchTerm) ||
                emoji.symbol.includes(searchTerm)
            );
            renderEmojis(filtered);
        });

        renderEmojis();
    </script>
